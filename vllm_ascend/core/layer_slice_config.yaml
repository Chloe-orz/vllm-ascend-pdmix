# Layer-slice dynamic configuration for cloud-side PassiveScheduler.
#
# Format:
#   <token_threshold_k>: <total_slice_count>
#
# The key is the prefill batch size in *thousands* of tokens.
# The value is the total number of layer slices for that batch.
#
# Matching rule (largest-threshold-first):
#   total_num_scheduled_tokens >= key * 1000  ->  use value
#
# Layer slicing is temporarily disabled below: every token threshold maps to
# one slice, so each prefill executes all layers at once.
#
# This file supports hot-reload: modify and save while the service is
# running; the next prefill batch will pick up the new config automatically.

# Edge-side DECODE_LAST delay schedule time (milliseconds).
# After DECODE_FIRST is picked, DECODE_LAST cannot be scheduled until
# this delay has elapsed, giving Cloud DM + P2P transfer time to complete.
# Default: 30 (ms).
decode_last_delay_schedule_ms: 10

# Cloud-side prefill-middle throttle: how long (in milliseconds) to wait for
# a decode-middle batch before falling back to another prefill-middle slice.
# Default: 10 (ms).
prefill_middle_throttle_ms: 500

16: 1
8: 1
4: 1
3: 1
2: 1
1: 1
0: 1
